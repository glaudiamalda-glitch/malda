<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Membuat Table 3 HTML</title>
</head>
<body>
    <table border="1">
        <tr>
            <th rowspan="2" bgcolor="pink">Bulan</th>
            <th colspan="2" bgcolor="orange">Jumlah Produk</th>
        </tr>
        <tr>
            <th bgcolor="skyblue">Ayam</th>
            <th bgcolor="grey">Ikan</th>
        </tr>
        <tr>
            <td>April</td>
            <td>100</td>
            <td>150</td>
        </tr>
       <tr>
            <td>Juli</td>
            <td>150</td>
            <td>250</td>
        </tr> 
    </table> 
</body>
</html>
